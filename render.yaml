# Render Blueprint: New → Blueprint → выбери этот репозиторий → Apply. Карта не нужна.
# Сервер сам пингует свой адрес (RENDER_EXTERNAL_URL), поэтому бесплатный тариф не засыпает.
services:
  - type: web
    name: bearite-server
    runtime: node
    rootDir: server
    buildCommand: echo ok
    startCommand: node bearite-server.js
    plan: free
    healthCheckPath: /
    envVars:
      - key: SERVER_NAME
        value: Bearite сервер
