# Render Blueprint: New → Blueprint → выбери этот репозиторий. Бесплатный тариф засыпает после 15 минут без запросов.
services:
  - type: web
    name: bearite-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /
    envVars:
      - key: SERVER_NAME
        value: Bearite сервер
