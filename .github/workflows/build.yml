name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  NDK_VERSION: "26.1.10909125"
  CMAKE_VERSION: "3.22.1"
  ANDROID_API: "24"
  # master Dobby (2024-03) не собирается под Android; проверено матрицей: рабочие 6f065cf, d353eea, 6a80a61
  DOBBY_REF: "6f065cfcce47e5aa43901910eb702884f3cf4777"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK and CMake
        run: |
          SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build Dobby
        run: |
          set +e
          bash scripts/build_dobby.sh 2>&1 | tee dobby_build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # дублируем ошибки в аннотации, чтобы их было видно без скачивания лога
            grep -E -i "error|fatal|cannot|not found|undefined" dobby_build.log | head -15 | cut -c1-300 | while IFS= read -r l; do echo "::error::${l}"; done
          fi
          exit "$rc"

      # Gradle ставим сами и с повторами: setup-gradle падал на скачивании (HTTP 503/504 у services.gradle.org).
      # 8.14.3 — последняя ветка 8.x, с которой работает наш Android Gradle Plugin 8.2.2 (Gradle 9 его не поддерживает)
      - name: Install Gradle 8.14.3 (with retries)
        run: |
          set -e
          V=8.14.3
          mkdir -p "$HOME/gradle-dist"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            for url in \
              "https://github.com/gradle/gradle-distributions/releases/download/v${V}/gradle-${V}-bin.zip" \
              "https://services.gradle.org/distributions/gradle-${V}-bin.zip"; do
              if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 -o "$HOME/gradle-dist/g.zip" "$url" && unzip -tq "$HOME/gradle-dist/g.zip" > /dev/null; then ok=1; break 2; fi
              echo "не вышло: $url (попытка $attempt)"
            done
            sleep $((attempt * 5))
          done
          [ "$ok" = 1 ] || { echo "::error::Не удалось скачать Gradle ${V}"; exit 1; }
          unzip -q "$HOME/gradle-dist/g.zip" -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-${V}/bin" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: |
          set +e
          gradle :app:assembleDebug :uploader:assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # ошибки компиляции и ресурсов дублируем в аннотации
            grep -E "^e: |error:|AAPT|Resource|What went wrong|Execution failed|> " gradle_build.log | head -25 | cut -c1-400 | while IFS= read -r l; do echo "::error::${l}"; done
          fi
          exit "$rc"

      # расшифровка адресов из аварии: положи смещения (hex, по одному в строке) в scripts/symbolize.txt
      - name: Symbolize crash offsets
        if: always()
        run: |
          NDK="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for lib in $(find app/build -name libbearite_mod.so); do
            echo "::notice::lib $lib size=$(stat -c %s "$lib") buildid=$("$TC/llvm-readelf" -n "$lib" | grep -o 'Build ID: .*')"
            [ -f scripts/symbolize.txt ] || continue
            while read -r off; do
              [ -z "$off" ] && continue
              r=$("$TC/llvm-addr2line" -f -C -i -e "$lib" "0x$off" | tr '\n' ' ')
              echo "::notice::$(basename "$(dirname "$lib")") $off => $r"
            done < scripts/symbolize.txt
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Bearite-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            uploader/build/outputs/apk/debug/*.apk

      # постоянная ссылка: релиз «latest» пересоздаётся при каждой сборке на main, APK всегда один и самый свежий
      - name: Publish latest APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk Bearite-debug.apk
          cp uploader/build/outputs/apk/debug/*.apk Bearite-Mods.apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest Bearite-debug.apk Bearite-Mods.apk --target "$GITHUB_SHA" \
            --title "Bearite: последняя сборка" \
            --notes "Коммит ${GITHUB_SHA::7}. Этот релиз заменяется при каждой сборке. Прямая ссылка: https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/Bearite-debug.apk"

      # все моды из sdk/mods/*: добавь туда папку с mod.json и src/*.c, и она соберётся сама
      - name: Build mods from sdk/mods
        run: |
          mkdir -p dist kit
          for d in sdk/mods/*/; do
            if [ -f "${d}mod.json" ]; then EXTRA_CFLAGS="-Werror" bash sdk/build-mod.sh "$d" dist; fi
          done
          (cd sdk && zip -qr ../kit/Bearite-ModKit.zip .)
          ls -la dist kit

      # готовые моды из репозитория, у которых своя сборка (CMake): сейчас sba-zoom
      - name: Build sba-zoom
        continue-on-error: true
        run: |
          cmake -S sdk/sba-zoom -B build-zoom \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DCMAKE_BUILD_TYPE=Release
          cmake --build build-zoom
          mkdir -p out-zoom/libs/arm64-v8a dist
          cp sdk/sba-zoom/mod.json out-zoom/
          [ -f sdk/sba-zoom/icon.png ] && cp sdk/sba-zoom/icon.png out-zoom/ || true
          cp build-zoom/libsbazoom.so out-zoom/libs/arm64-v8a/
          (cd out-zoom && zip -qr ../dist/sba-zoom.zip .)

      # каталог модов на сервере: релиз «mods» с zip-архивами и index.json, лаунчер показывает его во вкладке «Все моды»
      - name: Publish mods catalog
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist && cp mods-prebuilt/*.zip dist/ 2>/dev/null || true
          python3 - <<'PY'
          import glob, json, os, zipfile
          repo = os.environ["GITHUB_REPOSITORY"]
          mods = []
          for z in sorted(glob.glob("dist/*.zip")):
              with zipfile.ZipFile(z) as zf:
                  names = zf.namelist()
                  mj = next((n for n in names if n == "mod.json" or n.endswith("/mod.json")), None)
                  if not mj: continue
                  m = json.loads(zf.read(mj).decode("utf-8"))
              if m.get("id") in (None, "", "my-mod"): continue   # шаблон мода в каталог не попадает
              mods.append({"id": m["id"], "name": m.get("name", m["id"]), "version": str(m.get("version", "?")),
                           "author": m.get("author", ""), "description": m.get("description", ""),
                           "url": f"https://github.com/{repo}/releases/download/mods/{os.path.basename(z)}",
                           "size": os.path.getsize(z)})
          json.dump({"mods": mods}, open("dist/index.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          print(json.dumps(mods, ensure_ascii=False))
          PY
          gh release delete mods --cleanup-tag -y || true
          files=$(ls dist/*.zip dist/index.json)
          gh release create mods $files --target "$GITHUB_SHA" --latest=false \
            --title "Каталог модов" --notes "Каталог модов для лаунчера (index.json и архивы). Обновляется при каждой сборке."

      - uses: actions/upload-artifact@v4
        with:
          name: Bearite-mods
          path: dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Bearite-ModKit
          path: kit/Bearite-ModKit.zip
