name: Bearite Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bearite-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "26.1.10909125"
  CMAKE_VERSION: "3.22.1"
  ANDROID_API: "24"
  # Known working Dobby revision for Android builds.
  DOBBY_REF: "6f065cfcce47e5aa43901910eb702884f3cf4777"

jobs:
  build:
    name: Build APK and mod kit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          if [[ -z "$SDKM" ]]; then
            echo "::error::Android sdkmanager was not found under ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build Dobby
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build_dobby.sh 2>&1 | tee dobby_build.log

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_build.log

      - name: Symbolize native crash offsets
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [[ -z "$NDK" ]]; then
            echo "::warning::NDK path unavailable; skipping native symbolization"
            exit 0
          fi
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [[ ! -x "$TC/llvm-addr2line" || ! -x "$TC/llvm-readelf" ]]; then
            echo "::warning::NDK symbol tools unavailable; skipping native symbolization"
            exit 0
          fi
          found=0
          while IFS= read -r -d '' lib; do
            found=1
            echo "::notice::Library: $lib"
            echo "::notice::Build ID: $("$TC/llvm-readelf" -n "$lib" | grep -m1 'Build ID:' || true)"
            if [[ -f scripts/symbolize.txt ]]; then
              while IFS= read -r off || [[ -n "$off" ]]; do
                [[ -z "$off" ]] && continue
                resolved=$("$TC/llvm-addr2line" -f -C -i -e "$lib" "0x${off}" | tr '\n' ' ')
                echo "::notice::$(basename "$(dirname "$lib")") $off => $resolved"
              done < scripts/symbolize.txt
            fi
          done < <(find app/build -name libbearite_mod.so -print0 2>/dev/null || true)
          [[ "$found" -eq 1 ]] || echo "::notice::No libbearite_mod.so found to symbolize"

      - name: Build mods and ModKit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist kit
          for d in sdk/mods/*/; do
            [[ -f "${d}mod.json" ]] || continue
            EXTRA_CFLAGS="-Werror" bash sdk/build-mod.sh "$d" dist
          done
          (cd sdk && zip -qr ../kit/Bearite-ModKit.zip .)
          ls -la dist kit

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bearite-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bearite-build-logs-${{ github.run_number }}
          path: |
            dobby_build.log
            gradle_build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload compiled mods
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bearite-mods-${{ github.run_number }}
          path: dist/*.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Upload ModKit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bearite-ModKit-${{ github.run_number }}
          path: kit/Bearite-ModKit.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Bearite Android CI"
            echo
            echo "- Commit: `${GITHUB_SHA}`"
            echo "- Branch/event: `${GITHUB_REF_NAME}` / `${GITHUB_EVENT_NAME}`"
            echo "- Result: **${{ job.status }}**"
            echo
            echo "If the build failed, download the `Bearite-build-logs-${GITHUB_RUN_NUMBER}` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
