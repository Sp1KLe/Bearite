# Сборка модов в облаке, без компьютера и NDK у тебя.
# В этом репозитории файл не запускается (лежит не в .github/workflows/). Чтобы он заработал,
# скопируй его в свой форк как .github/workflows/build-mods.yml: моды берутся из sdk/mods/<имя>/,
# сборочный скрипт и заголовки из sdk/ (раскладка форка Bearite, ничего переносить не надо).
# После пуша открой вкладку Actions: готовые zip будут в Artifacts (Bearite-mods).
name: Build mods

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK
        run: |
          SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Build mods from sdk/mods
        run: |
          mkdir -p dist
          for d in sdk/mods/*/; do
            if [ -f "${d}mod.json" ]; then bash sdk/build-mod.sh "$d" dist; fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Bearite-mods
          path: dist/*.zip
